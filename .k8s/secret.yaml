# AWS Credentials Secret
# IMPORTANT: Replace placeholders with actual values or use external secrets management
# DO NOT commit real credentials to version control!
apiVersion: v1
kind: Secret
metadata:
  name: happytest-aws-credentials
  labels:
    app: happytest-reader
type: Opaque
stringData:
  # Replace these with actual credentials or use IRSA on EKS
  AWS_ACCESS_KEY_ID: "<your-access-key-id>"
  AWS_SECRET_ACCESS_KEY: "<your-secret-access-key>"
  AWS_REGION: "us-east-1"
  S3_BUCKET: "<your-s3-bucket>"
